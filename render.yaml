databases:
  - name: caloriess-db
    databaseName: caloriess
    user: caloriess

services:
  - name: caloriess-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: Render's Node build installs with NODE_ENV=production,
    # which skips devDependencies - but "typescript" (needed to compile) is
    # a devDependency.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caloriess-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set this once the frontend service exists and you know its public URL
      # (e.g. https://caloriess-frontend.onrender.com) - Render Blueprints
      # can't auto-fill a public HTTPS URL for cross-service references.
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

  - name: caloriess-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    # --include=dev: same reason as the backend - "typescript" and
    # "@tailwindcss/postcss" are devDependencies needed to build.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: out
    envVars:
      # Set this once the backend service exists and you know its public URL
      # (e.g. https://caloriess-backend.onrender.com). Build-time only for a
      # static export - changing it later requires a manual redeploy, not
      # just a restart, since NEXT_PUBLIC_* vars are baked in at build time.
      - key: NEXT_PUBLIC_API_URL
        sync: false
