databases:
  - name: caloriess-db
    databaseName: caloriess
    user: caloriess

services:
  - name: caloriess-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caloriess-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set this once the frontend service exists and you know its public URL
      # (e.g. https://caloriess-frontend.onrender.com) - Render Blueprints
      # can't auto-fill a public HTTPS URL for cross-service references.
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

  - name: caloriess-frontend
    type: web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Set this once the backend service exists and you know its public URL
      # (e.g. https://caloriess-backend.onrender.com).
      - key: NEXT_PUBLIC_API_URL
        sync: false
