databases:
  - name: caloriess-db
    databaseName: caloriess
    user: caloriess

services:
  - name: caloriess
    type: web
    runtime: node
    plan: free
    rootDir: .
    # Build the frontend's static export first (NEXT_PUBLIC_API_URL="" makes
    # it call the API with relative paths, since it's served from the same
    # origin as the backend in this topology), then copy it into
    # backend/public so the backend can serve it - see src/index.ts.
    # --include=dev on both: Render's Node build installs with
    # NODE_ENV=production, which skips devDependencies - but "typescript"
    # (both apps) and "@tailwindcss/postcss" (frontend) are devDependencies
    # needed to build.
    buildCommand: >-
      cd frontend && npm install --include=dev && NEXT_PUBLIC_API_URL= npm run build && cd ../backend &&
      npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build &&
      mkdir -p public && cp -r ../frontend/out/. public/
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caloriess-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
